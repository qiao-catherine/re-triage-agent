[project]
name = "ac-deal-triage"
version = "0.1.0"
description = "AC GTM take-home — real estate deal memo triage agent"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.50",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph-sdk>=0.1.40",
    "langsmith>=0.1.130",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "starlette>=0.37",
]

[project.optional-dependencies]
# Local-dev tools — `pip install -e ".[dev]"` to get them.
# Intentionally NOT in `dependencies` so the deployed image stays slim
# (LangGraph Platform doesn't need the CLI on the server side).
dev = [
    "langgraph-cli[inmem]>=0.2",
    "ruff",
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
